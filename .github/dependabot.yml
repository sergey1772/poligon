# Х-20-5: пины не гниют молча — предложения обновлений раз в неделю.
# Красное от Dependabot разбирается как дело, а не копится.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels: ["снасти"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels: ["контур"]
