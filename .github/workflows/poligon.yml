# Полигон открытого контура (Х-20-8): минуты Actions здесь не считаются —
# дом шлёт сюда снимок контура, а прогоны идут на чужих раннерах.
# Фотонность обязательна и тут (Статья 56 дома): часть длится меньше 45 с.
name: poligon

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      repeats:
        description: "повторов обхода сети"
        default: "12"

permissions:
  contents: read

concurrency:
  group: poligon-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cell:
    name: cell ${{ matrix.cell }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell: examples/тесты_полигона.py
            keep: "not сканеры_ворота_и_пины"
          - cell: examples/тесты_вердикта.py
            keep: "not отмена_на_главной_запрещена"
          - cell: examples/тесты_замечаний.py
            keep: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # actions/checkout@v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --quiet pytest
      - name: run cell (hard cap 45s = Article 56)
        shell: bash
        run: |
          set +e
          ARGS=()
          if [ -n "${{ matrix.keep }}" ]; then ARGS=(-k "${{ matrix.keep }}"); fi
          timeout 45 python -m pytest "${{ matrix.cell }}" -q -p no:cacheprovider "${ARGS[@]}"
          code=$?
          if [ "$code" = "124" ]; then
            echo "::error::cell ${{ matrix.cell }} hit the 45s cap - split it smaller"
          fi
          exit $code

  set:
    name: сеть шара ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # actions/checkout@v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: build graph (hard cap 45s)
        shell: bash
        run: timeout 45 python examples/сеть.py --собрать
      - name: walk shard (my share of the nodes)
        shell: bash
        run: |
          set -e
          timeout 45 python examples/сеть.py --шара-обхода ${{ matrix.shard }}/6 \
            --повторов ${{ github.event.inputs.repeats || '12' }} \
            --артефакт сеть-шара-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # actions/upload-artifact@v4
        if: always()
        with:
          name: сеть-шара-${{ matrix.shard }}
          path: сеть-шара-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 7

  verdict:
    name: verdict
    needs: [cell, set]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: summary
        shell: bash
        run: |
          echo "контур полигона: клетки и сеть отработали" >> "$GITHUB_STEP_SUMMARY"
          ls -la artifacts || true
          echo "клетки: ${{ needs.cell.result }} · сеть: ${{ needs.set.result }}" >> "$GITHUB_STEP_SUMMARY"
