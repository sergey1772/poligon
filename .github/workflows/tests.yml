# Ворота дома «Спрут»: батарея тестов + учение семьи.
# Стандарт: checkout@v7 / setup-python@v7 (кеш pip); matrix — 3.13 на
# каждый прогон, полная 3.12–3.14 — ночью и по слову (П-4, экономия).
# permissions только на чтение, параллельные прогоны отменяются.
# Урок 28.09: job_id — только латиница/цифры/_/-; кириллица в ключе →
# workflow отвергается на старте (прогон падает без задач). Кириллица —
# допустима только в name: (подписи).
name: ворота

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # Х-20-3 (слой 3): свой будильник — дом зовёт сервер через repository_dispatch.
  # cron GitHub задерживается и бывает пропущен; звонок из дома — отдельный повод.
  repository_dispatch:
    types: ["ночь", "будильник", "полигон"]
  schedule:
    # Ночь (П-4, экономия топлива): полная матрица 3.12–3.14 — раз в сутки;
    # на каждый прогон — одна версия (3.13), этого хватает воротам.
    - cron: '23 2 * * *'
  # Правка самих ворот — тоже повод (иначе контур правится без проверки).

permissions:
  contents: read

# Сканеры секретов читают данные pull-запроса (свойства PR) — этому шагу нужен
# ещё и `pull-requests: read`; без него прогон PR падал 403 «Resource not
# accessible by integration» (грабли 01.10, прогон бота 36842215420). Права
# остаются только на чтение, ничего не пишем.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # 60.3 (мировой опыт 01.10.2026): отменять прогоны можно только на боковых
  # ветвях (PR) — на главной каждый коммит заслуживает своего результата,
  # иначе не узнать, который из них сломал. Отменённый прогон не публикует
  # ни артефактов, ни результатов: отмена — не вердикт.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  batareya:
    name: Батарея боя и семьи
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # П-4 (экономия топлива, 30.09): 2000 мин/мес ≈ 50 полных прогонов.
        # Полная матрица 3.12–3.14 — по слову (workflow_dispatch) и ночью;
        # на обычный прогон — 3.13 (боевая версия дома).
        python-version: >-
          ${{ (github.event_name == 'schedule'
               || github.event_name == 'workflow_dispatch'
               || github.event_name == 'repository_dispatch')
              && fromJSON('["3.12","3.13","3.14"]')
              || fromJSON('["3.13"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Стандарт из базы — в свежем клоне производного нет
        run: python examples/уроки.py --стандарт
      - name: Батарея боя и семьи
        run: >
          python -m pytest -q
          examples/тесты_боя.py
          examples/тесты_выгрузки.py
          examples/тесты_двигателя.py
          examples/тесты_двигателя_разработки.py
          examples/тесты_скиллов.py
          examples/тесты_школы.py
          examples/тесты_метазавода.py
          examples/тесты_гигиены.py
          examples/тесты_выше_продакшна.py
          examples/тесты_качества.py
          examples/тесты_расписания.py
          examples/тесты_сторожа_узлов.py
          examples/тесты_мерила_узлов.py
          examples/тесты_периодики.py
          examples/тесты_снастей.py
          examples/тесты_двери_снабжения.py
          examples/тесты_рук.py
          --junit-xml=batareya-${{ matrix.python-version }}.xml
      - if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4   # actions/upload-artifact@v5
        with:
          name: batareya-${{ matrix.python-version }}
          path: "*.xml"
          if-no-files-found: ignore

  uchenie:
    name: Учение семьи (end-to-end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Стандарт из базы — в свежем клоне производного нет
        run: python examples/уроки.py --стандарт
      - name: Учение семьи (end-to-end, 31 ворот)
        run: python examples/учение_комплекс.py

  skanery:
    name: Свои сканеры (секреты · баги · уязвимости)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-skanery.txt
      - name: "Снасти (свои, бесплатные — вместо платных Code/Secret Protection)"
        run: python -m pip install --quiet -r requirements-skanery.txt
      - name: Секреты — gitleaks (чужое действие закреплено коммит-SHA)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7   # gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: "Баги — ruff (только ломающее E9, F63, F7, F82)"
        run: python -m ruff check examples/ --select E9,F63,F7,F82 --no-cache
      - name: "Уязвимости — pip-audit по снастям дома"
        run: python -m pip_audit -r requirements-dev.txt -r requirements-skanery.txt --progress-spinner off
